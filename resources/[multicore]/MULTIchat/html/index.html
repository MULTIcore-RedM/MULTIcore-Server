<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MULTIchat</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <script src="nui://MULTIcore/html/theme/preset.js"></script>
    <link rel="stylesheet" href="chat.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <div id="chat" class="mc-root mch-chat">
        <div class="mch-feed" id="feed"><div class="mch-lines" id="lines"></div></div>
        <div class="mch-box mc-hidden" id="box">
            <input id="input" class="mch-input" type="text" autocomplete="off" spellcheck="false">
            <div class="mch-suggest mc-hidden" id="suggest"></div>
        </div>
    </div>
    <script src="chat.js"></script>
</body>
</html>
