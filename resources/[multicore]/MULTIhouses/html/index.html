<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIhouses</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <script src="nui://MULTIcore/html/theme/preset.js"></script>
    <link rel="stylesheet" href="houses.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body class="mc-root">
    <div id="housing-ui" class="hidden">
        <div class="menu-container mc-panel">
            <div class="menu-header">
                <div class="header-row">
                    <button class="icon-btn" id="back-btn" data-i18n-aria="nui_back" aria-label="Back">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                    <div class="title-wrap">
                        <h1 id="menu-title" class="mc-title" data-i18n="nui_title_agent">Estate Agent</h1>
                        <p class="subtitle mc-subtitle" data-i18n="nui_subtitle">Property</p>
                    </div>
                    <button class="icon-btn" id="close-btn" data-i18n-aria="nui_close" aria-label="Close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
            <div class="mc-rule"></div>

            <div class="menu-content mc-scroll" id="menu-content"></div>
        </div>

        <div class="input-dialog hidden" id="input-dialog">
            <div class="dialog-container mc-panel">
                <div class="dialog-header">
                    <h2 id="dialog-title" class="mc-heading">Confirm</h2>
                </div>
                <div class="mc-rule"></div>
                <div class="dialog-content" id="dialog-content"></div>
                <div class="dialog-footer mc-btn-row">
                    <button class="mc-btn" id="dialog-cancel" data-i18n="nui_cancel">Cancel</button>
                    <button class="mc-btn primary" id="dialog-confirm" data-i18n="nui_confirm">Confirm</button>
                </div>
            </div>
        </div>

        <div class="notification-container" id="notification-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
