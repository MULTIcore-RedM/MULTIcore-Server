<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIwagons</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <link rel="stylesheet" href="wagons.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <div id="shop-container" class="mc-root mc-hidden">
        <div class="mc-panel shop-panel">
            <div class="panel-header">
                <button class="mc-btn small icon-btn" id="header-back" type="button" data-title="ui_back">&#8249;</button>
                <div class="title-wrap">
                    <h1 class="mc-title" id="shop-name"></h1>
                    <div class="mc-subtitle" id="shop-subtitle"></div>
                </div>
                <button class="mc-btn small icon-btn" id="close-btn" type="button" data-title="ui_close">&#215;</button>
            </div>
            <hr class="mc-rule">

            <div class="money-bar" id="money-bar">
                <div class="money-item">
                    <span class="money-label" data-t="ui_cash"></span>
                    <span class="mc-money" id="player-cash"></span>
                </div>
                <div class="money-item">
                    <span class="money-label" data-t="ui_gold"></span>
                    <span class="mc-money mc-gold" id="player-gold"></span>
                </div>
            </div>

            <div class="mc-tabs" id="nav-tabs">
                <button class="mc-tab active" data-view="store" type="button" data-t="ui_tab_store"></button>
                <button class="mc-tab" data-view="mywagons" type="button" data-t="ui_tab_mine"></button>
            </div>

            <div class="shop-content">
                <!-- wagons for sale -->
                <div class="view" id="view-store">
                    <div class="category-grid mc-scroll" id="category-grid"></div>
                    <div class="wagon-grid-wrapper mc-hidden" id="wagon-grid-wrapper">
                        <div class="wagon-grid-header">
                            <button class="mc-btn small icon-btn" id="btn-back-category" type="button" data-title="ui_back">&#8249;</button>
                            <div class="mc-heading" id="category-title"></div>
                        </div>
                        <div class="wagon-grid mc-scroll" id="wagon-grid"></div>
                        <div class="no-items mc-note mc-hidden" id="no-wagons" data-t="ui_no_wagons"></div>
                    </div>
                </div>

                <!-- your wagons -->
                <div class="view mc-hidden" id="view-mywagons">
                    <div class="mywagons-layout">
                        <div class="mywagons-list">
                            <div class="mc-heading" data-t="ui_your_wagons"></div>
                            <div class="mc-list mc-scroll" id="mywagons-items"></div>
                            <div class="no-items mc-note" id="no-mywagons" data-t="ui_none_owned"></div>
                        </div>
                        <div class="wagon-detail-panel mc-scroll mc-hidden" id="wagon-detail-panel">
                            <div class="detail-panel-header">
                                <div class="detail-name" id="detail-wagon-name"></div>
                                <span class="mc-note" id="detail-wagon-model"></span>
                            </div>
                            <hr class="mc-rule">
                            <div class="mc-list" id="detail-actions"></div>
                            <div class="customize-section mc-hidden" id="customize-section">
                                <div class="mc-heading" data-t="ui_customize"></div>
                                <div class="mc-list" id="customize-options"></div>
                                <div class="customize-preview mc-hidden" id="customize-preview">
                                    <div class="customize-preview-header">
                                        <span class="mc-note" id="customize-preview-title"></span>
                                        <button class="mc-btn small icon-btn" id="btn-back-customize" type="button" data-title="ui_back">&#8249;</button>
                                    </div>
                                    <div class="mc-list customize-items mc-scroll" id="customize-items"></div>
                                    <div class="mc-btn-row customize-actions">
                                        <button class="mc-btn" id="btn-cancel-customize" type="button" data-t="ui_cancel"></button>
                                        <button class="mc-btn primary" id="btn-save-customize" type="button" data-t="ui_save" disabled></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- chop shop -->
                <div class="view mc-hidden" id="view-chop">
                    <div class="chop-layout">
                        <div class="detail-name" id="chop-wagon-name"></div>
                        <span class="mc-note" id="chop-wagon-model"></span>
                        <hr class="mc-rule">
                        <div class="mc-list" id="chop-rewards"></div>
                        <p class="mc-note chop-note mc-hidden" id="chop-owned-note" data-t="ui_chop_owned"></p>
                        <div class="mc-btn-row customize-actions">
                            <button class="mc-btn" id="btn-chop-cancel" type="button" data-t="ui_cancel"></button>
                            <button class="mc-btn danger" id="btn-chop-confirm" type="button" data-t="ui_scrap"></button>
                        </div>
                    </div>
                </div>
            </div>

            <hr class="mc-rule">
            <div class="shop-footer">
                <span class="mc-note" id="footer-hint"></span>
                <div class="mc-btn-row" id="rotate-buttons">
                    <button class="mc-btn small icon-btn" id="rotate-left" type="button" data-title="ui_rotate_left">&#10226;</button>
                    <button class="mc-btn small icon-btn" id="rotate-right" type="button" data-title="ui_rotate_right">&#10227;</button>
                </div>
            </div>
        </div>
    </div>

    <!-- name a new wagon -->
    <div id="name-modal" class="mc-root modal mc-hidden">
        <div class="modal-backdrop"></div>
        <div class="mc-panel modal-container">
            <div class="mc-title modal-title" data-t="ui_name_title"></div>
            <hr class="mc-rule">
            <div class="mc-field">
                <label for="name-input" data-t="ui_name_text"></label>
                <input type="text" class="mc-input" id="name-input" data-ph="ui_name_ph" maxlength="16">
            </div>
            <div class="mc-btn-row modal-footer">
                <button class="mc-btn" id="name-modal-cancel" type="button" data-t="ui_cancel"></button>
                <button class="mc-btn primary" id="name-modal-confirm" type="button" data-t="ui_confirm"></button>
            </div>
        </div>
    </div>

    <!-- are you sure -->
    <div id="confirm-modal" class="mc-root modal mc-hidden">
        <div class="modal-backdrop"></div>
        <div class="mc-panel modal-container">
            <div class="mc-title modal-title" id="confirm-title"></div>
            <hr class="mc-rule">
            <p id="confirm-message"></p>
            <div class="mc-btn-row modal-footer">
                <button class="mc-btn" id="confirm-modal-cancel" type="button" data-t="ui_no"></button>
                <button class="mc-btn primary" id="confirm-modal-confirm" type="button" data-t="ui_yes"></button>
            </div>
        </div>
    </div>

    <div class="mc-root wg-toasts" id="notification-container"></div>

    <script src="wagons.js"></script>
</body>
</html>
