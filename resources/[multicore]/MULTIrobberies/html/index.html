<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MULTIrobberies</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <script src="nui://MULTIcore/html/theme/preset.js"></script>
    <link rel="stylesheet" href="mg.css">
</head>
<body>
    <div id="ui" class="mc-root mc-hidden">
        <div class="mc-panel mg-panel">
            <h1 class="mc-title" id="mg-title"></h1>
            <div class="mc-subtitle" id="mg-sub"></div>
            <hr class="mc-rule">
            <div class="mg-stage">
                <canvas id="mg-canvas" width="560" height="360"></canvas>
                <div class="mg-flash" id="mg-flash"></div>
            </div>
            <div class="mg-bar"><div class="mg-bar-fill" id="mg-time"></div></div>
            <div class="mg-status">
                <span id="mg-state"></span>
                <span class="mg-pips" id="mg-pips"></span>
            </div>
            <div class="mg-help" id="mg-help"></div>
        </div>
    </div>
    <script src="mg.js"></script>
</body>
</html>
