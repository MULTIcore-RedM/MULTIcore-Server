<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MULTIserver</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
<!-- Every label comes from locales/*.lua (data-l = text, data-lp = placeholder). -->
<div id="ms" class="mc-root mc-hidden">
    <!-- player list -->
    <section class="board mc-panel mc-fade mc-hidden" id="players">
        <img class="mc-brand mc-brand-corner" src="nui://MULTIcore/html/theme/img/mc-mark.png" alt="">
        <header class="head">
            <h1 class="mc-title" data-l="ui_players_title"></h1>
            <div class="mc-subtitle" id="plCount"></div>
        </header>
        <div class="tools">
            <input class="mc-input" id="plSearch" data-lp="ui_search">
            <span class="mc-note" id="plStaff"></span>
        </div>
        <div class="table">
            <div class="row thead" id="plHead"></div>
            <div class="mc-list mc-scroll rows" id="plRows"></div>
        </div>
        <footer class="foot mc-prompts">
            <span><span class="mc-key">R</span><span data-l="ui_refresh"></span></span>
            <span><span class="mc-key">Esc</span><span data-l="ui_close"></span></span>
        </footer>
    </section>

    <!-- server info -->
    <section class="info mc-panel mc-fade mc-hidden" id="info">
        <img class="mc-brand mc-brand-above" src="nui://MULTIcore/html/theme/img/mc-mark.png" alt="">
        <header class="head">
            <h1 class="mc-title" id="inName"></h1>
            <div class="mc-subtitle" id="inCount"></div>
        </header>
        <div class="mc-rule"></div>
        <div class="desc mc-scroll" id="inDesc"></div>
        <div class="mc-list links" id="inLinks"></div>
        <div class="msg mc-note" id="inMsg"></div>
        <footer class="foot mc-prompts">
            <span><span class="mc-key">Esc</span><span data-l="ui_close"></span></span>
        </footer>
    </section>
</div>
<script src="app.js"></script>
</body>
</html>
