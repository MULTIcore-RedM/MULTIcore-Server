<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MULTIradial</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <script src="nui://MULTIcore/html/theme/preset.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="radial.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <div id="radial" class="mc-root mr-radial mc-hidden">
        <div class="mr-title" id="title"></div>
        <div class="mr-body">
            <div class="mr-side mr-left" id="left"></div>
            <div class="mr-hub">
                <div class="mr-spike mr-spike-up"></div>
                <div class="mr-ring"><img src="nui://MULTIcore/html/theme/img/mc-mark.png" alt="MC"></div>
                <div class="mr-spike mr-spike-down"></div>
            </div>
            <div class="mr-side mr-right" id="right"></div>
        </div>
        <button type="button" class="mr-btn mr-cancel" id="cancel"><span class="mr-in"><i class="fa-solid fa-xmark"></i><b id="cancelText"></b></span></button>
    </div>
    <script src="radial.js"></script>
</body>
</html>
