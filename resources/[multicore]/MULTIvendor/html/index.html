<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MULTIvendor</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body class="mc-root">

    <!-- ===================== VENDOR SELL MENU ===================== -->
    <div id="vendorMenu" class="menu-wrapper">
        <div class="vendor-panel mc-panel mc-fade">
            <img class="mc-brand mc-brand-above" src="nui://MULTIcore/html/theme/img/mc-mark.png" alt="">
            <div class="header-section">
                <span class="header-side"></span>
                <h1 class="mc-title" id="vendorTitle">Vendor</h1>
                <button class="mc-btn small close-btn" id="closeBtn">Close</button>
            </div>
            <hr class="mc-rule">
            <div class="order-layout">
                <!-- LEFT: sellable items -->
                <div class="col">
                    <button class="mc-btn primary full-width" id="sellEverythingBtn">Sell Everything</button>
                    <div class="mc-tabs category-tabs" id="categoryTabs"></div>
                    <h3 class="mc-heading sub-heading" id="availableHeading">Available Items</h3>
                    <div id="itemGrid" class="item-grid mc-scroll"></div>
                </div>
                <!-- RIGHT: sell controls -->
                <div class="col">
                    <h3 class="mc-heading sub-heading" id="sellHeading">Sell</h3>
                    <div id="sellDetails" class="details-content mc-scroll"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
