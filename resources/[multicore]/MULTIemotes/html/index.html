<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MULTIemotes</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
<!-- Every label comes from locales/*.lua (data-l = text, data-lp = placeholder). -->
<div id="em" class="mc-root mc-hidden">
    <section class="menu mc-panel mc-fade">
        <img class="mc-brand mc-brand-above" src="nui://MULTIcore/html/theme/img/mc-mark.png" alt="">
        <h1 class="mc-title" data-l="title"></h1>
        <hr class="mc-rule">

        <!-- category picker, game style:  ‹ Greetings › -->
        <div class="mc-stepper cat">
            <button id="catPrev" aria-label="previous">&#8249;</button>
            <div class="mc-stepper-text"><span id="catName"></span><small id="catCount"></small></div>
            <button id="catNext" aria-label="next">&#8250;</button>
        </div>
        <div class="dots" id="dots"></div>

        <input class="mc-input search" id="search" data-lp="ui_search" autocomplete="off" spellcheck="false">

        <div class="mc-list mc-scroll list" id="list"></div>

        <div class="msg" id="msg"></div>
        <hr class="mc-rule">
        <footer class="mc-prompts prompts">
            <span><span class="mc-key">Enter</span><span data-l="ui_play"></span></span>
            <span id="stopPrompt"><span class="mc-key" id="stopKey">X</span><span data-l="ui_stop"></span></span>
            <span><span class="mc-key">&#8592; &#8594;</span><span data-l="ui_choose"></span></span>
            <span><span class="mc-key">Esc</span><span data-l="ui_close"></span></span>
        </footer>
    </section>
</div>
<script src="app.js"></script>
</body>
</html>
