<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MULTIjobs</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <script src="nui://MULTIcore/html/theme/preset.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
<!-- Every word comes from locales/*.lua (data-l = text, data-lp = placeholder); app.js fills the rest. -->
<div id="app" class="mc-root mc-hidden">
    <div class="sheet mc-panel mc-fade">
        <img class="mc-brand mc-brand-corner" src="nui://MULTIcore/html/theme/img/mc-mark.png" alt="">
        <header class="head">
            <h1 class="mc-title" id="title"></h1>
            <div class="mc-subtitle" id="subtitle"></div>
        </header>
        <nav class="mc-tabs mc-hidden" id="tabs"></nav>
        <div class="body">
            <section class="col list-col">
                <div class="list-head" id="listHead"></div>
                <div class="mc-list mc-scroll" id="list"></div>
            </section>
            <section class="col detail-col mc-scroll" id="detail"></section>
        </div>
        <div class="msg" id="msg"></div>
        <footer class="foot">
            <div class="foot-left" id="footLeft"></div>
            <span class="mc-note"><span class="mc-key">Esc</span><span data-l="ui_close"></span></span>
        </footer>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
