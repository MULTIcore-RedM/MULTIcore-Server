<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MULTItarget</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <script src="nui://MULTIcore/html/theme/preset.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="target.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <div id="target" class="mc-root mt-target mc-hidden">
        <!-- the eye in the middle of the screen (as rsg-target); it lights up when something has options.
             Nothing is ever drawn in the world: no dots, no sprites. -->
        <div class="mt-eye" id="eye"><i class="fa-solid fa-eye"></i></div>
        <div class="mt-card mc-hidden" id="card">
            <div class="mt-title" id="title"></div>
            <div class="mt-sub" id="sub"></div>
            <div class="mt-list" id="list"></div>
        </div>
    </div>
    <script src="target.js"></script>
</body>
</html>
