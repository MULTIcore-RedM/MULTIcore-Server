<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MULTIbank</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <script src="nui://MULTIcore/html/theme/preset.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
<!-- Every label comes from locales/*.lua (data-l = text, data-lp = placeholder). -->
<div id="bank" class="mc-root mc-hidden">
    <div class="book mc-fade">
        <!-- left page: account and teller -->
        <section class="page mc-panel left">
            <img class="mc-brand mc-brand-above" src="nui://MULTIcore/html/theme/img/mc-mark.png" alt="">
            <header class="head">
                <div>
                    <h1 class="mc-title" id="bankName"></h1>
                    <div class="mc-hand holder"><span data-l="ui_passbook_of"></span> <span id="holder"></span></div>
                </div>
                <div class="acct mc-note">
                    <div><span data-l="ui_account"></span> <b id="charId"></b></div>
                    <div id="citizenid"></div>
                </div>
            </header>
            <hr class="mc-rule">

            <div class="tiles">
                <div class="tile"><span class="lbl" data-l="ui_cash"></span><span class="mc-money val" id="cash"></span></div>
                <div class="tile main"><span class="lbl" id="accountLabel"></span><span class="mc-money val" id="balance"></span></div>
                <div class="tile"><span class="lbl" data-l="ui_gold"></span><span class="mc-money mc-gold val" id="gold"></span></div>
            </div>

            <nav class="mc-tabs" id="tabs">
                <button class="mc-tab active" data-tab="deposit" data-l="ui_tab_deposit"></button>
                <button class="mc-tab" data-tab="withdraw" data-l="ui_tab_withdraw"></button>
                <button class="mc-tab" data-tab="transfer" id="tabTransfer" data-l="ui_tab_transfer"></button>
                <button class="mc-tab" data-tab="gold" id="tabGold" data-l="ui_tab_gold"></button>
                <button class="mc-tab" data-tab="clip" id="tabClip" data-l="ui_tab_clip"></button>
            </nav>

            <div class="pane" data-pane="deposit">
                <div class="mc-field">
                    <label for="depAmount" data-l="ui_dep_amount"></label>
                    <input class="mc-input" id="depAmount" inputmode="decimal" placeholder="0.00" maxlength="12">
                </div>
                <div class="mc-btn-row quick" data-for="depAmount" data-max="cash"></div>
                <div class="mc-note" id="depNote"></div>
                <div class="mc-btn-row go"><button class="mc-btn primary" data-act="deposit" data-input="depAmount" data-l="ui_btn_deposit"></button></div>
            </div>

            <div class="pane mc-hidden" data-pane="withdraw">
                <div class="mc-field">
                    <label for="wdAmount" data-l="ui_wd_amount"></label>
                    <input class="mc-input" id="wdAmount" inputmode="decimal" placeholder="0.00" maxlength="12">
                </div>
                <div class="mc-btn-row quick" data-for="wdAmount" data-max="balance"></div>
                <div class="mc-note" id="wdNote"></div>
                <div class="mc-btn-row go"><button class="mc-btn primary" data-act="withdraw" data-input="wdAmount" data-l="ui_btn_withdraw"></button></div>
            </div>

            <div class="pane mc-hidden" data-pane="transfer">
                <div class="mc-field">
                    <label for="trTarget" data-l="ui_pay_to"></label>
                    <div class="inline">
                        <input class="mc-input" id="trTarget" data-lp="ui_pay_to_ph" maxlength="50">
                        <button class="mc-btn small" id="trFind" data-l="ui_lookup"></button>
                    </div>
                    <div class="mc-hand payee" id="trPayee"></div>
                </div>
                <div class="mc-field">
                    <label for="trAmount" data-l="ui_amount"></label>
                    <input class="mc-input" id="trAmount" inputmode="decimal" placeholder="0.00" maxlength="12">
                </div>
                <div class="mc-note" id="trNote"></div>
                <div class="mc-btn-row go"><button class="mc-btn primary" data-act="transfer" data-input="trAmount" data-l="ui_btn_send"></button></div>
            </div>

            <div class="pane mc-hidden" data-pane="gold">
                <div class="rates">
                    <div><span class="lbl" data-l="ui_we_sell"></span> <span class="mc-money" id="goldBuy"></span> <span class="mc-note" data-l="ui_per_gold"></span></div>
                    <div><span class="lbl" data-l="ui_we_buy"></span> <span class="mc-money" id="goldSell"></span> <span class="mc-note" data-l="ui_per_gold"></span></div>
                </div>
                <div class="mc-field">
                    <label for="goldAmount" data-l="ui_gold_amount"></label>
                    <input class="mc-input" id="goldAmount" inputmode="decimal" placeholder="0.00" maxlength="10">
                </div>
                <div class="mc-note" id="goldNote"></div>
                <div class="mc-btn-row go">
                    <button class="mc-btn primary" data-act="gold_buy" data-input="goldAmount" data-l="ui_btn_buy"></button>
                    <button class="mc-btn" data-act="gold_sell" data-input="goldAmount" data-l="ui_btn_sell"></button>
                </div>
            </div>

            <div class="pane mc-hidden" data-pane="clip">
                <div class="mc-field">
                    <label for="clipAmount" data-l="ui_clip_amount"></label>
                    <input class="mc-input" id="clipAmount" inputmode="decimal" placeholder="0.00" maxlength="12">
                </div>
                <div class="mc-note" id="clipNote"></div>
                <div class="mc-btn-row go"><button class="mc-btn primary" data-act="money_clip" data-input="clipAmount" data-l="ui_btn_clip"></button></div>
            </div>

            <div class="msg" id="msg"></div>
            <footer class="foot">
                <span class="mc-note"><span class="mc-key">Esc</span><span data-l="ui_leave"></span></span>
                <button class="mc-btn small" id="sdBtn" data-l="ui_btn_safedeposit"></button>
                <button class="mc-btn small" id="close" data-l="ui_close"></button>
            </footer>
        </section>

        <!-- right page: ledger -->
        <section class="page mc-panel right">
            <h2 class="mc-heading" data-l="ui_ledger"></h2>
            <div class="ledger-head">
                <span data-l="ui_col_date"></span><span data-l="ui_col_entry"></span><span class="num" data-l="ui_col_amount"></span><span class="num" data-l="ui_col_balance"></span>
            </div>
            <div class="ledger mc-scroll" id="ledger"></div>
        </section>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
