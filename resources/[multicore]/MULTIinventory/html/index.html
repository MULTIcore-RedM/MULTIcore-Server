<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MULTIinventory</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
<!-- MULTIinventory satchel (GPL v3, part of MULTIcore).
     Every visible word comes from the locale table Lua sends (data-l = key). -->
<div id="app" class="mc-root">

    <div id="inv" class="mi-inv mc-hidden">
        <div class="mi-panes">
            <!-- the player's satchel -->
            <section class="mc-panel mi-pane mc-fade" id="paneP" data-pane="p">
                <img class="mc-brand mc-brand-corner" src="nui://MULTIcore/html/theme/img/mc-mark.png" alt="">
                <div class="mi-title-row">
                    <h1 class="mc-title" id="pTitle" data-l="ui_satchel"></h1>
                    <button class="mc-btn small mc-hidden" id="tradeBtn" data-l="ui_trade"></button>
                </div>
                <div class="mi-stats">
                    <div class="mi-weight"><div class="mi-bar"><i id="pBar"></i></div><span id="pWeight"></span></div>
                    <span class="mi-slots" id="pSlots"></span>
                </div>
                <div class="mi-grid mc-scroll" id="pGrid"></div>
            </section>

            <!-- second pane: stash / drop / custom / other player, or the ground -->
            <section class="mc-panel mi-pane mc-fade" id="paneO" data-pane="o">
                <h1 class="mc-title" id="oTitle"></h1>
                <div class="mi-stats" id="oStats">
                    <div class="mi-weight"><div class="mi-bar"><i id="oBar"></i></div><span id="oWeight"></span></div>
                    <span class="mi-slots" id="oSlots"></span>
                </div>
                <div class="mi-grid mc-scroll" id="oGrid"></div>
                <div class="mi-ground mc-hidden" id="oGround"><span class="mi-ground-mark"></span><span class="mc-note mc-hand" data-l="ui_ground_hint"></span></div>
            </section>

            <!-- trade window: my offer (t), the other player's offer (u), cash, accept -->
            <section class="mc-panel mi-pane mi-trade mc-fade mc-hidden" id="paneT" data-pane="t">
                <h1 class="mc-title" id="tTitle"></h1>
                <div class="mi-trade-head">
                    <span class="mi-trade-who" data-l="ui_trade_yours"></span>
                    <span class="mi-trade-ok mc-hidden" id="tOk" data-l="ui_trade_accepted"></span>
                </div>
                <div class="mi-grid mi-trade-grid mc-scroll" id="tGrid"></div>
                <div class="mi-trade-cash">
                    <label for="tCash" data-l="ui_trade_cash"></label>
                    <span class="mi-dollar">$</span>
                    <input id="tCash" class="mc-input" inputmode="decimal" maxlength="10" placeholder="0.00">
                    <button class="mc-btn small" id="tCashSet" data-l="ui_trade_set"></button>
                    <span class="mc-note mi-trade-have" id="tHave"></span>
                </div>
                <hr class="mc-rule">
                <div class="mi-trade-head">
                    <span class="mi-trade-who" id="uName"></span>
                    <span class="mi-trade-ok mc-hidden" id="uOk" data-l="ui_trade_accepted"></span>
                </div>
                <div class="mi-grid mi-trade-grid mc-scroll" id="uGrid"></div>
                <div class="mi-trade-cash">
                    <label data-l="ui_trade_cash"></label>
                    <span class="mc-money" id="uCash"></span>
                </div>
                <div class="mi-trade-foot">
                    <span class="mc-note mi-trade-hint" id="tHint"></span>
                    <div class="mc-btn-row">
                        <button class="mc-btn" id="tCancel" data-l="ui_trade_cancel"></button>
                        <button class="mc-btn primary" id="tAccept"></button>
                    </div>
                </div>
            </section>
        </div>

        <!-- the selected item -->
        <section class="mc-panel mi-detail" id="detail">
            <div class="mi-detail-info">
                <div class="mi-detail-head">
                    <h2 class="mi-name" id="dName"></h2>
                    <span class="mi-tag mc-hidden" id="dTag" data-l="ui_equipped"></span>
                    <span class="mi-tag mc-hidden" id="dLock" data-l="ui_trade_in"></span>
                </div>
                <div class="mi-desc mc-hand" id="dDesc"></div>
                <div class="mi-meta" id="dMeta"></div>
            </div>
            <div class="mi-detail-act" id="dAct">
                <div class="mi-amount" id="dAmountBox">
                    <label data-l="ui_amount"></label>
                    <input id="dAmount" class="mc-input" type="number" min="1">
                    <button class="mc-btn small" id="dAll" data-l="ui_all"></button>
                </div>
                <div class="mc-btn-row mi-actions" id="dButtons"></div>
            </div>
        </section>

        <div class="mc-prompts mi-prompts">
            <span><span class="mc-key">Esc</span><span data-l="ui_close"></span></span>
            <span><span class="mc-key" data-l="ui_key_shift"></span><span data-l="ui_quick_move"></span></span>
            <span><span class="mc-key" data-l="ui_key_drag"></span><span data-l="ui_move"></span></span>
            <span><span class="mc-key" data-l="ui_key_dbl"></span><span id="kDbl" data-l="ui_use"></span></span>
        </div>
    </div>

    <!-- hotbar (no focus) -->
    <div id="hotbar" class="mi-hotbar mc-hidden"></div>

    <!-- item pop-ups (no focus) -->
    <div id="itembox" class="mi-itembox"></div>

    <div id="ghost" class="mi-ghost mc-hidden"></div>
</div>
<script src="app.js"></script>
</body>
</html>
