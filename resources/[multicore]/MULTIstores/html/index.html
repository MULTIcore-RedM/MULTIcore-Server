<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MULTIstores</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
<!-- MULTIstores store screen (GPL v3, part of MULTIcore by RINGO (RINGOscripting)).
     Every visible word comes from the locale table Lua sends (data-l = key). -->
<div id="app" class="mc-root">
    <div id="store" class="ms-store mc-hidden">
        <section class="mc-panel ms-col mc-fade">
            <img class="mc-brand mc-brand-above" src="nui://MULTIcore/html/theme/img/mc-mark.png" alt="">
            <header class="ms-head">
                <div class="mc-subtitle" id="type"></div>
                <h1 class="mc-title" id="title"></h1>
                <div class="ms-cash"><span data-l="ui_cash"></span><span class="mc-money" id="cash"></span></div>
            </header>

            <nav class="mc-tabs ms-tabs" id="tabs"></nav>

            <div class="ms-list mc-scroll" id="list"></div>

            <footer class="ms-detail" id="detail">
                <hr class="mc-rule">
                <div class="ms-dname" id="dName"></div>
                <div class="ms-ddesc mc-hand" id="dDesc"></div>
                <div class="ms-line" id="dEachLine"><span data-l="ui_price_each" id="dEachLabel"></span><span class="mc-money" id="dEach"></span></div>
                <div class="ms-line ms-amount">
                    <span data-l="ui_amount"></span>
                    <div class="ms-stepper">
                        <button class="ms-step" id="dMinus" type="button">&#8249;</button>
                        <input id="dAmount" class="mc-input" type="number" min="1" value="1">
                        <button class="ms-step" id="dPlus" type="button">&#8250;</button>
                    </div>
                </div>
                <div class="ms-line ms-total" id="dTotalLine"><span id="dTotalLabel" data-l="ui_total"></span><span class="mc-money" id="dTotal"></span></div>
                <div class="ms-act">
                    <span class="ms-cant mc-hidden" id="dCant" data-l="ui_cant_afford"></span>
                    <button class="mc-btn primary ms-go" id="dGo" type="button"></button>
                </div>
            </footer>
        </section>

        <div class="mc-prompts ms-prompts">
            <span><span class="mc-key">Enter</span><span id="pGo"></span></span>
            <span><span class="mc-key">&#8597;</span><span data-l="ui_select"></span></span>
            <span><span class="mc-key">&#8596;</span><span data-l="ui_amount"></span></span>
            <span><span class="mc-key">Tab</span><span data-l="ui_category"></span></span>
            <span><span class="mc-key">Esc</span><span data-l="ui_close"></span></span>
        </div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
