<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MULTIhelpers</title>
    <link rel="stylesheet" href="nui://MULTIcore/html/theme/multi.css">
    <script src="nui://MULTIcore/html/theme/preset.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="feather/feather.css">
    <link rel="stylesheet" href="minigames/minigames.css">
    <link rel="stylesheet" href="custom.css">
</head>
<body>
    <!-- vorp_menu -->
    <div id="menu" class="mc-root mc-panel mh-menu mc-hidden">
        <img class="mc-brand mc-brand-corner" src="nui://MULTIcore/html/theme/img/mc-mark.png" alt="">
        <div class="mh-head">
            <h1 class="mc-title" id="menu-title"></h1>
            <div class="mh-subtext" id="menu-subtext"></div>
        </div>
        <hr class="mc-rule">
        <div id="menu-list" class="mh-list"></div>
        <div class="mh-count" id="menu-count"></div>
        <div id="menu-desc" class="mh-desc mc-hidden"></div>
        <div id="menu-buttons" class="mc-btn-row mh-buttons mc-hidden"></div>
        <div class="mh-keys" id="menu-keys"></div>
    </div>

    <!-- vorp_inputs and menu.displayInput -->
    <div id="dialog-wrap" class="mh-dialog-wrap mc-hidden">
        <form id="dialog" class="mc-root mc-panel mh-dialog" novalidate autocomplete="off">
            <h2 class="mc-title mh-dialog-title" id="dialog-title"></h2>
            <div class="mc-note" id="dialog-desc"></div>
            <div class="mc-field" id="dialog-field"></div>
            <div class="mh-error" id="dialog-error"></div>
            <div class="mc-btn-row mh-dialog-buttons">
                <button type="button" class="mc-btn" id="dialog-cancel"></button>
                <button type="submit" class="mc-btn primary" id="dialog-ok"></button>
            </div>
        </form>
    </div>

    <!-- vorp_progressbar -->
    <div id="progress" class="mc-root mh-progress mc-hidden">
        <div id="progress-linear" class="mh-linear">
            <div class="mh-linear-label" id="progress-label"></div>
            <div class="mh-linear-track"><div class="mh-linear-fill" id="progress-fill"></div></div>
        </div>
        <div id="progress-circle" class="mh-circle mc-hidden">
            <div class="mh-ring" id="progress-ring"><div class="mh-ring-hole"><span id="progress-pct"></span></div></div>
            <div class="mh-circle-label" id="progress-clabel"></div>
        </div>
    </div>

    <!-- syn_minigame / fx-minigame skill bar -->
    <div id="skill" class="mc-root mc-panel mh-skill mc-hidden">
        <div class="mh-skill-track">
            <div class="mh-skill-zone" id="skill-zone"></div>
            <div class="mh-skill-marker" id="skill-marker"></div>
        </div>
        <div class="mh-skill-hint" id="skill-hint"></div>
    </div>

    <script src="app.js"></script>
    <script src="feather/feather.js"></script>
    <script src="minigames/minigames.js"></script>
</body>
</html>
