# MULTIcore by RINGO (RINGOscripting) - txAdmin recipe.
# In txAdmin's setup choose "Remote URL Template" and paste:
#   https://raw.githubusercontent.com/MULTIcore-RedM/MULTIcore-Server/main/recipe/multicore.yaml
# The server comes in two downloads, each small enough for slower connections:
#   MULTIcore-Server     the base server (core, login, character, inventory, HUD, target, chat, voice, weather, admin)
#   MULTIcore-Resources  the other MULTI scripts and the item pictures
$engine: 3
$onesync: on
name: MULTIcore Server
version: 1.1.0
author: RINGO (RINGOscripting)
description: MULTIcore by RINGO (RINGOscripting). One core where RSG v2, VORP and RedEM:RP scripts run side by side, with its own full set of base scripts in the game's own look. Free and open source (GPL v3).

tasks:
  # 1. The base server
  - action: download_github
    src: https://github.com/MULTIcore-RedM/MULTIcore-Server
    ref: main
    dest: ./tmp/multicore
    timeoutSeconds: 900

  - action: move_path
    src: ./tmp/multicore/resources
    dest: ./resources

  # 2. The MULTI scripts and item pictures, straight into resources/[multicore-resources]
  - action: download_github
    src: https://github.com/MULTIcore-RedM/MULTIcore-Resources
    ref: main
    subpath: resources/[multicore-resources]
    dest: ./resources/[multicore-resources]
    timeoutSeconds: 900

  - action: move_path
    src: ./tmp/multicore/recipe/server.cfg
    dest: ./server.cfg

  - action: move_path
    src: ./tmp/multicore/multicore-icon-96.png
    dest: ./multicore-icon-96.png

  # Licence and credits stay with the server (GPL v3)
  - action: move_path
    src: ./tmp/multicore/LICENSE
    dest: ./LICENSE

  - action: move_path
    src: ./tmp/multicore/NOTICE.md
    dest: ./NOTICE.md

  - action: move_path
    src: ./tmp/multicore/docs
    dest: ./docs

  # Database: txAdmin makes it; the scripts create their own tables on first start
  - action: connect_database

  # Clean up
  - action: remove_path
    path: ./tmp
